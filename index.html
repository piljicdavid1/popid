<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Star ID Generator</title>
  <meta name="description" content="Generate your custom hyperpop ID card based on your favorite pop star era.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Full-width top navigation bar -->
  <header class="top-nav">
    <img src="assets/REPUBLICOFPOP.svg" alt="Republic of Pop" class="logo-image">
  </header>

  <main id="appContainer">
    <!-- Phase 1: Data Collection -->
    <section id="phase1" class="phase active">
      
      <form id="dataForm">
        <div class="form-content">
        <div class="form-group center-label">
          <label for="firstName">FIRST NAME</label>
          <input type="text" id="firstName" required>
        </div>
        
        <div class="form-group center-label">
          <label for="lastName">LAST NAME</label>
          <input type="text" id="lastName" required>
        </div>

        <div class="form-group center-label">
          <label for="xHandle">X USERNAME</label>
          <input type="text" id="xHandle" required>
        </div>

        <div class="form-group center-label mugshot-group">
          <label>MUGSHOT</label>
          <label class="file-upload-label" id="uploadLabel">
            <span id="fileUploadText">MUGSHOT</span>
            <input type="file" id="photoUpload" accept="image/*" required>
          </label>
        </div>
        </div> <!-- End of form-content blue block -->
        
        <button type="submit" class="btn submit-img-btn">
          <img src="assets/GETMEANID.svg" alt="Get Me An ID">
        </button>
      </form>
    </section>

    <!-- Phase 2: Era Selection -->
    <section id="phase2" class="phase hidden">
      <div class="era-grid">
        <!-- Era 1: Detour -->
        <div class="era-card" data-era="detour">
          <div class="era-content">
            <h3>DETOUR</h3>
            <p>KIM PETRAS</p>
          </div>
        </div>
        <!-- Era 2: Wor$t Girl -->
        <div class="era-card" data-era="worstgirl">
          <div class="era-content">
            <h3>WOR$T GIRL IN AMERICA</h3>
            <p>SLAYYYTER</p>
          </div>
        </div>
        <!-- Era 3: SISTER -->
        <div class="era-card" data-era="sister">
          <div class="era-content">
            <h3>SISTER</h3>
            <p>FROST CHILDREN</p>
          </div>
        </div>
      </div>
      
      <div class="header" style="margin-top: 2rem;">
        <h2>SELECT ERA</h2>
      </div>
    </section>

    <!-- Phase 3: ID Generation -->
    <section id="phase3" class="phase hidden">

      <div class="canvas-container">
        <!-- Hidden canvas for generation (2x scaled for high-DPI crisp text rendering) -->
        <canvas id="idCanvas" width="2024" height="1276" style="display:none;"></canvas>
        <div class="preview-wrapper">
          <img id="idPreview" src="" alt="Generated ID Preview" />
        </div>
      </div>

      <div class="action-buttons">
        <button id="downloadBtn" class="btn primary glow">DOWNLOAD</button>
        <button id="startOverBtn" class="btn secondary">START OVER</button>
      </div>
    </section>
  </main>

  <script src="assets.js"></script>
  <script src="app.js"></script>
</body>
</html>
